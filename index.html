<style>
:root{--ink:#302b27;--muted:#82796f;--paper:#fffdf9;--line:#eee4d8;--accent:#b76e4b;--accent2:#e9b486;--bg:#f6efe5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0,#fff9ee 0,transparent 42%),var(--bg);color:var(--ink);font-family:ui-sans-serif,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:28px 20px 56px}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;letter-spacing:.08em}.logo{font-weight:700;color:var(--accent)}.hero,.panel{background:var(--paper);border:1px solid #f0e7dc;border-radius:26px;box-shadow:0 16px 55px #6042260e}.hero{margin-top:34px;padding:clamp(28px,7vw,62px);text-align:center;overflow:hidden;position:relative}.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.18em;font-weight:700}.hero h1{font-size:clamp(32px,7vw,54px);line-height:1.18;letter-spacing:-.04em;margin:18px 0 14px}.hero p{color:var(--muted);line-height:1.9;margin:0 auto;max-width:470px}.spark{font-size:58px;margin:8px 0 2px}.btn{appearance:none;border:0;border-radius:999px;padding:15px 28px;background:var(--ink);color:white;font:inherit;font-weight:700;cursor:pointer;transition:.18s;box-shadow:0 7px 18px #302b2722}.btn:hover{transform:translateY(-2px);background:var(--accent)}.hero .btn{margin-top:28px}.fine{font-size:12px!important;margin-top:17px!important}.panel{margin-top:24px;padding:clamp(23px,5vw,42px)}.hidden{display:none!important}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.track{height:5px;background:#f0e8df;border-radius:6px;margin:13px 0 32px;overflow:hidden}.fill{height:100%;width:12.5%;background:var(--accent);border-radius:6px;transition:width .25s}.qtitle{font-size:clamp(22px,4vw,29px);line-height:1.5;margin:0 0 24px}.choices{display:grid;gap:12px}.choice{width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:#fffefa;color:var(--ink);font:inherit;line-height:1.65;cursor:pointer;transition:.15s}.choice:hover{border-color:var(--accent2);background:#fff8ef;transform:translateY(-1px)}.letter{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#f4e9dc;color:var(--accent);font-size:13px;font-weight:700;margin-right:10px;vertical-align:middle}.result{text-align:center}.result .animal{font-size:74px;margin:2px}.result h2{font-size:clamp(29px,6vw,42px);margin:5px 0 8px}.tag{display:inline-block;border-radius:99px;padding:7px 13px;background:#f7eee3;color:var(--accent);font-size:13px}.desc{color:#60584f;line-height:1.95;text-align:left;margin:26px auto 0;max-width:520px}.traits{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}.traits span{border:1px solid var(--line);padding:7px 12px;border-radius:99px;font-size:13px;color:#63594e}.quote{font-size:18px;font-weight:700;color:var(--accent);margin:18px 0 4px}.subresult{margin:14px 0;color:var(--muted);font-size:14px}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.secondary{background:#f5eee6;color:var(--ink);box-shadow:none}.note{font-size:12px;color:#978d82;line-height:1.7;margin:23px auto 0;max-width:510px}.footer{text-align:center;color:#a09588;font-size:12px;margin:24px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#302b27;color:white;padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:520px){.wrap{padding:19px 14px 36px}.hero{margin-top:22px;border-radius:22px}.panel{border-radius:22px}.choice{padding:14px}.top{font-size:12px}}
/* Warm, cozy notebook palette */

.wrap{max-width:790px}.top{letter-spacing:.04em}.logo{background:#fffdf8;border:1px solid #e7d8c1;padding:9px 14px;border-radius:999px;box-shadow:0 4px 0 #e7d8c1}.hero,.panel{border:2px solid #fffdf8;outline:1px dashed #dfc8a9;outline-offset:-9px;border-radius:34px;box-shadow:0 12px 0 #e8dcc8,0 22px 50px #8064471a;background:rgba(255,253,248,.97)}

.hero:before,.hero:after{position:absolute;font-size:25px;opacity:.8;pointer-events:none}.hero:before{content:'✦';color:#d8a75e;top:22px;right:11%}.hero:after{content:'♡';color:#a7b28b;bottom:27px;left:10%;font-size:32px}.spark{display:inline-grid;place-items:center;width:104px;height:104px;border-radius:38% 62% 55% 45%;background:#f7e7bd;box-shadow:0 7px 0 #e7d5a5;transform:rotate(-5deg);font-size:61px}.eyebrow{color:#9a704c;letter-spacing:.12em}.hero h1{color:#55483a;text-shadow:2px 3px 0 #f1e3ce}.hero p{color:#887b69}.btn{background:#a97750;box-shadow:0 6px 0 #875f40,0 10px 16px #9d744433}.btn:hover{background:#926541;box-shadow:0 4px 0 #785236;transform:translateY(1px)}.hero .btn{margin-top:28px}.fine{color:#988873}
.panel{margin-top:27px;padding:clamp(28px,6vw,46px)}.progress-head{color:#82745f;font-weight:700}.track{height:12px;background:#efe6d5;border:2px solid white;box-shadow:inset 0 1px 3px #cfc1aa;margin:13px 0 30px}.fill{background:linear-gradient(90deg,#d4ae70,#b9865d,#95a27c);box-shadow:0 1px 4px #9e805555}.qtitle{color:#55483a}.choice{border:2px solid #ece2d2;border-radius:20px;background:#fffefa;color:#5d5144;box-shadow:0 3px 0 #eee5d8}.choice:hover{border-color:#c8ad88;background:#fffaf0;box-shadow:0 4px 0 #e7dac5;transform:translateY(-2px)}.letter{background:#f3ead9;color:#946743;border:1px solid #e7d6ba}.result .animal{display:grid;place-items:center;width:128px;height:128px;margin:12px auto 10px;border-radius:43% 57% 49% 51%;background:#f7e7bd;box-shadow:0 7px 0 #e5d5a8;font-size:78px}.result h2{color:#55483a}.tag{background:#f4eadb;color:#946743;border:1px solid #e7d7c1}.traits span{background:#fffaf1;border-color:#eadfcd;color:#766650}.quote{color:#956b46}.desc{color:#675b4c}.secondary{background:#e9eddf;color:#5f6d4e;box-shadow:0 4px 0 #d4dbc7}.note,.footer{color:#928572}.toast{background:#625447;box-shadow:0 5px 18px #62544730}

<body><main class="wrap"><div class="top"><span class="logo">小小动物观察局</span><span>一场轻松的自我探索</span></div>
<section id="home" class="hero"><div class="spark">🐾</div><div class="eyebrow">A LITTLE PERSONALITY QUIZ</div><h1>你的灵魂动物<br>是什么？</h1><p>从日常的小选择里，发现那个最像你的动物伙伴。<br>没有标准答案，选最真实的自己就好。</p><button class="btn" id="start">开始测试　→</button><p class="fine">8 道小题 · 约 2 分钟 · 娱乐向测试</p></section>
<section id="quiz" class="panel hidden"><div class="progress-head"><span id="step">第 1 题 / 共 8 题</span><span id="pct">12%</span></div><div class="track"><div id="fill" class="fill"></div></div><h2 id="question" class="qtitle"></h2><div id="choices" class="choices"></div></section>
<section id="result" class="panel result hidden"><div class="eyebrow">YOUR SPIRIT ANIMAL</div><div id="animal" class="animal"></div><h2 id="name"></h2><div id="tag" class="tag"></div><div id="traits" class="traits"></div><p id="description" class="desc"></p><div id="quote" class="quote"></div><p id="secondary" class="subresult"></p><div class="result-actions"><button id="share" class="btn">分享我的结果</button><button id="again" class="btn secondary">再测一次</button></div><p class="note">本测试为娱乐向自我探索，不构成心理测评或专业建议。</p></section><div class="footer">凭直觉作答，答案里藏着你的小小光芒 ✨</div></main><div id="toast" class="toast">已复制结果，快去分享吧</div>
<script>
const animals={cat:{name:'猫',emoji:'🐈',tag:'安静观察的独立派',traits:['独立','敏锐','慢热'],desc:'你有自己的节奏，也有细腻的观察力。比起立刻融入，你更愿意先看清周围，再把真诚留给值得的人。独处能让你充电，而你的温柔常常藏在不声张的细节里。',quote:'“我不是冷淡，只是在认真感受世界。”'},dog:{name:'狗',emoji:'🐕',tag:'热情可靠的守护派',traits:['真诚','忠诚','重情'],desc:'你把关系看得很认真，愿意用行动表达在乎。朋友需要支持时，你常常是那个说到做到的人。记得也给自己留一点力气，让关心别人和照顾自己都能发生。',quote:'“认定了你，我就会认真站在你这边。”'},fox:{name:'狐狸',emoji:'🦊',tag:'机敏灵活的观察派',traits:['机敏','灵活','有主见'],desc:'你擅长察觉局势里的细节，也能在变化中找到新的走法。你不一定急着表达，但心里往往已经有了判断。把聪明用来开路，也别忘了偶尔让自己放心尝试。',quote:'“看起来随和，心里自有地图。”'},dolphin:{name:'海豚',emoji:'🐬',tag:'好奇开朗的连接派',traits:['好奇','开朗','善连接'],desc:'你容易被新鲜事物点亮，也很会把人和话题连接起来。你的轻快常给身边带来活力。即使今天不想热闹也没关系，你不需要一直负责让所有人开心。',quote:'“生活有趣一点，大家一起更好。”'},bear:{name:'熊',emoji:'🐻',tag:'沉稳可靠的安心派',traits:['稳定','踏实','有担当'],desc:'你给人的感觉很稳，关键时刻愿意承担、愿意守住重要的事。你不必总是做最坚强的那一个；适当地求助，也是在认真保护自己的能量。',quote:'“不用声势很大，关键时候我会在。”'},deer:{name:'鹿',emoji:'🦌',tag:'温柔细腻的共感派',traits:['温柔','细腻','共情'],desc:'你能留意到别人情绪里的微小变化，也愿意用温柔回应。这样的敏感是一种能力，同时也需要边界。照顾好自己的感受，你的善意才能一直明亮。',quote:'“柔软不是脆弱，是认真感受的力量。”'},owl:{name:'猫头鹰',emoji:'🦉',tag:'理性沉静的思考派',traits:['理性','谨慎','爱思考'],desc:'你习惯先理解，再行动。把事情想清楚会让你安心，也让你的判断更有分量。遇到不确定时，允许自己先迈一小步，有些答案会在行动中出现。',quote:'“想明白很重要，开始也同样重要。”'},otter:{name:'水獭',emoji:'🦦',tag:'亲切活泼的陪伴派',traits:['亲切','活泼','重陪伴'],desc:'你喜欢把快乐变成可以分享的东西，也擅长让相处变得轻松。你珍惜陪伴，却不必每次都做气氛担当；安静地待着，也一样值得被喜欢。',quote:'“快乐这件事，有人一起更有趣。”'}};
const qs=[
{t:'到了一个不太熟悉的聚会，你通常会：',o:[['cat','先找个舒服的位置观察，遇到感兴趣的话题再加入。'],['dog','主动和人打招呼，让大家尽快熟络起来。'],['fox','听听大家在聊什么，找到合适的时机接话。'],['deer','先陪在熟悉的人身边，慢慢适应现场。']]},
{t:'接手一件没做过的任务时，你通常会：',o:[['owl','先弄清楚目标和步骤，再开始动手。'],['otter','找人一起做，边讨论边推进。'],['bear','先确认大家都知道各自要做什么，避免有人落下。'],['dolphin','先试试看，遇到问题再调整方法。']]},
{t:'朋友因为一件事很烦恼，来找你倾诉时，你会：',o:[['deer','静静听对方说，等对方愿意再给建议。'],['dog','让对方知道你会支持TA，能帮的地方就去做。'],['owl','帮TA把问题拆开，看看有哪些解决办法。'],['otter','陪TA换个环境，先喘口气再说。']]},
{t:'原定计划突然取消，你更可能：',o:[['cat','觉得也好，正好按自己的节奏安排时间。'],['otter','赶紧找朋友商量替代方案，继续一起行动。'],['bear','先确认接下来怎么安排，让事情别乱成一团。'],['dolphin','把空出来的时间留给临时冒出的新想法。']]},
{t:'做重要决定时，你最看重什么？',o:[['owl','信息够不够、利弊是否想清楚。'],['deer','这个决定会不会影响重要的人。'],['dolphin','有没有机会尝试一种新可能。'],['fox','做了之后是否还留有调整空间。']]},
{t:'团队讨论卡住、大家都没主意时，你通常会：',o:[['fox','提出一个新角度，让大家重新打开思路。'],['otter','先照顾一下大家的状态，别让气氛太紧张。'],['bear','把已经确定的部分整理好，保证事情继续往前走。'],['owl','追问关键问题，帮大家找出真正卡住的地方。']]},
{t:'忙完一天后，什么最能让你恢复状态？',o:[['cat','独自待一会儿，安静做自己的事。'],['dog','和亲近的人聊聊天，确认彼此都好。'],['dolphin','做点有趣的新活动，给日常换换空气。'],['owl','整理思绪，想清楚今天发生了什么。']]},
{t:'你发现自己犯了一个小错误，通常会：',o:[['fox','先想清楚原因，下次怎么避免。'],['dog','尽快补救，也会主动告诉受影响的人。'],['bear','先稳住局面，把该处理的事情安排好。'],['deer','不困在懊恼里，调整一下继续往前。']]}
];
let idx=0, scores={};const $=id=>document.getElementById(id);function show(which){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==which))}function render(){const q=qs[idx];$('step').textContent=`第 ${idx+1} 题 / 共 ${qs.length} 题`;$('pct').textContent=`${Math.round((idx+1)/qs.length*100)}%`;$('fill').style.width=`${(idx+1)/qs.length*100}%`;$('question').textContent=q.t;$('choices').innerHTML='';q.o.forEach(([key,label],i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="letter">${'ABCD'[i]}</span>${label}`;b.onclick=()=>{scores[key]=(scores[key]||0)+1;idx++;if(idx<qs.length)render();else result()};$('choices').appendChild(b)})}function result(){show('result');const rank=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const [key,score]=rank[0],a=animals[key];$('animal').className=`animal animal-${key}`;$('animal').setAttribute('role','img');$('animal').setAttribute('aria-label',a.name+'插画');$('name').textContent=`你的灵魂动物是${a.name}`;$('tag').textContent=a.tag;$('traits').innerHTML=a.traits.map(x=>`<span>${x}</span>`).join('');$('description').textContent=a.desc;$('quote').textContent=a.quote;const ties=rank.filter(x=>x[1]===score);$('secondary').textContent=ties.length>1?`你的气质有多面：${ties.slice(0,2).map(x=>animals[x[0]].name).join(' × ')}，并列成为你的主动物。`:rank[1][1]>0?`隐藏副属性：${animals[rank[1][0]].name}（${animals[rank[1][0]].traits[0]}）`:'先给自己一点时间，更多一面会慢慢显现。';window.scrollTo({top:0,behavior:'smooth'})}function start(){idx=0;scores={};show('quiz');render();window.scrollTo({top:0,behavior:'smooth'})}function share(){const title=`测出我的灵魂动物是${$('name').textContent.replace('你的灵魂动物是','')}！${$('tag').textContent}`;const url=window.location.href.split('#')[0];const text=`${title}\n${$('quote').textContent}\n你也来测测看～\n测试链接：${url}`;if(navigator.share){navigator.share({title:'我的灵魂动物测试结果',text,url}).catch(()=>copy(text))}else copy(text)}function copy(t){if(navigator.clipboard&&location.protocol==='https:')navigator.clipboard.writeText(t).then(()=>toast()).catch(()=>fallback(t));else fallback(t)}function fallback(t){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();toast()}function toast(){$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}$('start').onclick=start;$('again').onclick=start;$('share').onclick=share;
</script></body></html>
